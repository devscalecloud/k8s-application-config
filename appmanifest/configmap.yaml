apiVersion: v1
kind: ConfigMap
metadata:
  name: k8secommerce-config
  namespace: dapo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: k8secommerce
data:
  PORT: "8080"
  APP_ENV: "Non-Production"
  STORE_NAME: "Abayomi Store"
  PROMO_BANNER: "Free delivery on orders over $500"
  CURRENCY_SYMBOL: "$"
  SESSION_TTL_MINUTES: "60"
