apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8secommerce
  namespace: dapo
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: k8secommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8secommerce
  template:
    metadata:
      labels:
        app: k8secommerce
    spec:
      containers:
        - name: k8secommerce
          image: devscalecloud/k8secommerce:v2
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: k8secommerce-config
            - secretRef:
                name: k8secommerce-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
